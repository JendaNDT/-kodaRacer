name: Sestavení hry (Android APK + Windows EXE)

on:
  push:
    paths:
      - "godot/**"
      - "build/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-v1

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          set -e
          TPL=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          if [ ! -x ~/godot-bin/godot ] || [ ! -f "$TPL/android_release.apk" ]; then
            mkdir -p ~/godot-bin "$TPL"
            cd ~/godot-bin
            BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
            curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q -o godot.zip
            mv -f Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
            rm godot.zip
            curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q -o templates.tpz
            mv -f templates/* "$TPL/"
            rm -rf templates templates.tpz
          fi
          ~/godot-bin/godot --version

      - name: Import project
        run: ~/godot-bin/godot --headless --path godot --import

      - name: Test – full race against the AI
        run: |
          ~/godot-bin/godot --headless --path godot -- --autotest --fast=8 --timeout=200 2>&1 | tee race-test.log
          if grep -E "SCRIPT ERROR|Parse Error" race-test.log; then exit 1; fi
          grep -q "TEST PASS" race-test.log

      - name: Test – championship over all tracks
        run: |
          ~/godot-bin/godot --headless --path godot -- --cuptest --fast=8 --timeout=900 2>&1 | tee cup-test.log
          if grep -E "SCRIPT ERROR|Parse Error" cup-test.log; then exit 1; fi
          grep -q "TEST PASS: championship finished" cup-test.log

      - name: Test – time trial against the ghost
        run: |
          ~/godot-bin/godot --headless --path godot -- --trialtest --fast=8 --timeout=400 2>&1 | tee trial-test.log
          if grep -E "SCRIPT ERROR|Parse Error" trial-test.log; then exit 1; fi
          grep -q "TEST PASS: time trial with ghost" trial-test.log

      - name: Test – shortcuts (worth it only with a turbo or the star, laps counted right)
        run: |
          ~/godot-bin/godot --headless --path godot -- --cuttest --fast=8 2>&1 | tee cut-test.log
          grep "^CUT" cut-test.log
          if grep -E "SCRIPT ERROR|Parse Error" cut-test.log; then exit 1; fi
          grep -q "TEST PASS: shortcuts work on every track" cut-test.log

      - name: Test – computer drivers on every track (Hard, no item boxes)
        run: |
          ~/godot-bin/godot --headless --path godot -- --aitest --diff=2 --no-items --fast=8 2>&1 | tee ai-test.log
          grep "^AI" ai-test.log
          if grep -E "SCRIPT ERROR|Parse Error" ai-test.log; then exit 1; fi
          grep -q "TEST PASS: the computer drivers finish" ai-test.log

      - name: Test – new items (blue missile, oil, lightning, shield)
        run: |
          ~/godot-bin/godot --headless --path godot -- --itemtest --fast=8 2>&1 | tee item-test.log
          if grep -E "SCRIPT ERROR|Parse Error" item-test.log; then exit 1; fi
          grep -q "TEST PASS: every item works" item-test.log

      - name: Test – take-offs only from the ramp (turbo and star, all tracks)
        run: |
          ~/godot-bin/godot --headless --path godot -- --jumptest --fast=8 2>&1 | tee jump-test.log
          if grep -E "SCRIPT ERROR|Parse Error" jump-test.log; then exit 1; fi
          grep -q "TEST PASS: take-offs only from the ramp" jump-test.log

      - name: Test – take-offs only from the ramp on the mirrored tracks
        run: |
          ~/godot-bin/godot --headless --path godot -- --jumptest --mirror --fast=8 2>&1 | tee jump-mirror-test.log
          if grep -E "SCRIPT ERROR|Parse Error" jump-mirror-test.log; then exit 1; fi
          grep -q "TEST PASS: take-offs only from the ramp" jump-mirror-test.log

      - name: Test – unlocks (made-up cups and time trials, paints, secret driver, mirrored tracks, developer's ghost)
        run: |
          ~/godot-bin/godot --headless --path godot -- --unlocktest 2>&1 | tee unlock-test.log
          if grep -E "SCRIPT ERROR|Parse Error" unlock-test.log; then exit 1; fi
          if grep "ITEM CHECK.*FAIL" unlock-test.log; then exit 1; fi
          grep -q "TEST PASS: unlocks work" unlock-test.log

      - name: Test – steering by tilting the phone (made-up sensor readings, levelling at the start)
        run: |
          ~/godot-bin/godot --headless --path godot -- --tilttest --timeout=60 2>&1 | tee tilt-test.log
          if grep -E "SCRIPT ERROR|Parse Error" tilt-test.log; then exit 1; fi
          if grep "TILT CHECK.*FAIL" tilt-test.log; then exit 1; fi
          grep -q "TEST PASS: tilting steers" tilt-test.log

      - name: Test – vibrations (every event, never more than 10 a second, nothing when off; also for two players)
        run: |
          ~/godot-bin/godot --headless --path godot -- --hapticstest --fast=8 --timeout=300 2>&1 | tee haptics-test.log
          ~/godot-bin/godot --headless --path godot -- --hapticstest --players=2 --fast=8 --timeout=300 2>&1 | tee haptics2-test.log
          grep -h "^HAPTIC" haptics-test.log haptics2-test.log
          if grep -hE "SCRIPT ERROR|Parse Error" haptics-test.log haptics2-test.log; then exit 1; fi
          grep -q "TEST PASS: every event buzzes" haptics-test.log
          grep -q "TEST PASS: every event buzzes" haptics2-test.log

      - name: Test – Wi-Fi game on a mirrored track with 120 ms delay each way, every item in turn, everybody on the shortcut, gold paint
        run: |
          ~/godot-bin/godot --headless --path godot -- --nettest=host --item-cycle --cut-always --mirror --unlock=mirror,paint2_0 --paint=2 --timeout=260 > host.log 2>&1 &
          sleep 3
          ~/godot-bin/godot --headless --path godot -- --nettest=client --cut-always --fake-lag=120 --fake-jitter=20 --timeout=260 > client.log 2>&1 || true
          wait || true
          grep -h "TEST\|PREDICTION\|CLIENT SAW\|CLIENT FELT" host.log client.log
          for w in "modrá raketa" olej štít blesk zkratka zrcadlo lak; do grep "CLIENT SAW" client.log | grep -q "$w" || { echo "client never saw: $w"; exit 1; }; done
          grep "CLIENT FELT" client.log | grep -q '"finish": 2' || { echo "the client's player never felt the finish"; exit 1; }
          if grep -hE "SCRIPT ERROR|Parse Error" host.log client.log; then exit 1; fi
          grep -q "TEST PASS" host.log
          grep -q "TEST PASS" client.log

      - name: Test – finding games on the network
        run: |
          ~/godot-bin/godot --headless --path godot -- --nettest=host --timeout=20 > disc-host.log 2>&1 &
          sleep 3
          ~/godot-bin/godot --headless --path godot -- --disctest 2>&1 | tee disc.log
          wait || true
          grep -q "FOUND HOSTS" disc.log

      - name: Test – a different game version is refused
        run: |
          ~/godot-bin/godot --headless --path godot -- --nettest=host --timeout=15 > ver-host.log 2>&1 &
          sleep 3
          ~/godot-bin/godot --headless --path godot -- --nettest=client --fake-version=0.0.1 --timeout=10 2>&1 | tee ver-client.log || true
          wait || true
          grep -q "JOIN FAILED: Hostitel má jinou verzi hry" ver-client.log
          if grep -hE "SCRIPT ERROR" ver-host.log ver-client.log; then exit 1; fi

      - name: Export Windows EXE
        run: |
          mkdir -p dist
          ~/godot-bin/godot --headless --path godot --export-release "Windows" "$GITHUB_WORKSPACE/dist/SkodaRacer.exe" 2>&1 | tee export-win.log
          test -s dist/SkodaRacer.exe

      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/build/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          ~/godot-bin/godot --headless --path godot --export-release "Android" "$GITHUB_WORKSPACE/dist/SkodaRacer.apk" 2>&1 | tee export-android.log
          test -s dist/SkodaRacer.apk

      - name: Show results
        run: ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: SkodaRacer
          path: dist/

      - name: Publish test build (release "testovaci-build")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Automaticky sestaveno z větve ${GITHUB_REF_NAME} (commit ${GITHUB_SHA::7}).

          - SkodaRacer.apk: Android (stáhni v telefonu a nainstaluj, povol instalaci z neznámých zdrojů)
          - SkodaRacer.exe: Windows (stáhni a spusť; při varování SmartScreen klikni na Další informace → Přesto spustit)"
          gh release delete testovaci-build --yes --cleanup-tag || true
          gh release create testovaci-build dist/SkodaRacer.apk dist/SkodaRacer.exe \
            --target "$GITHUB_SHA" --prerelease \
            --title "Škoda Racer – testovací build" \
            --notes "$NOTES"
